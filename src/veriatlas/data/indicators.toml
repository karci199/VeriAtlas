# Indicator dictionary — what every id in the fact table means.
#
# This file is a record of decisions, not data. TUIK does not tell us that "bina" and
# "daire" are different things; we do. So it lives in git, next to the code, with the
# reasoning attached.
#
# Rules:
#   - every indicator names a topic and a unit declared below
#   - `dims` lists the breakdown keys an indicator may carry; anything else fails at
#     load time, which is what keeps the flexible dims field from becoming a free-for-all
#   - `views` lists the ways the screen may draw it. The explorer offers exactly these
#     tabs and greys out the rest, so "which chart fits this number" is a recorded
#     decision here, not a branch buried in the page (decision K10)
#   - Turkish is a label, never an id (decision K1)

# region Topics — the left-hand tree, in display order

[topic.nufus]
label_tr = "Nüfus"
label_en = "Population"
order = 10

[topic.dogurganlik]
label_tr = "Doğurganlık"
label_en = "Fertility"
order = 20

# Death is not fertility, so it does not fit under "Doğurganlık", and it is not a stock
# like the population count, so it does not fit under "Nüfus" either. Births stay with
# fertility — a birth count is read next to the rates computed from it — and deaths get
# their own place.
[topic.olum]
label_tr = "Ölüm"
label_en = "Mortality"
order = 25

[topic.evlenme_bosanma]
label_tr = "Evlenme ve boşanma"
label_en = "Marriage and divorce"
order = 22

[topic.yapi_ruhsati]
label_tr = "Yapı ruhsatı"
label_en = "Building permits"
order = 30

[topic.belediye_hizmetleri]
label_tr = "Belediye su, atıksu ve atık"
label_en = "Municipal water, wastewater and waste"
order = 40

[topic.enerji]
label_tr = "Enerji"
label_en = "Energy"
order = 45

# endregion

# region Dimensions — the breakdown keys and what their stored values are called
#
# Values are ids in the fact table (`sex=female`), so the Turkish the reader sees lives
# here, next to everything else that is a label (K1). A dimension with no `values` table
# carries values that are already readable — age bands print as "25-29" in any language.

[dim.sex]
label_tr = "Cinsiyet"
label_en = "Sex"

[dim.sex.values]
female = "Kadın"
male = "Erkek"
# Not a third sex: the value that means "the two together". It exists because the median
# age has no published total and one had to be computed (see the indicator's note), and
# it is a stored value rather than the page's "Tümü (topla)" because a median cannot be
# summed into being.
total = "Toplam"

[dim.age]
label_tr = "Yaş grubu"
label_en = "Age group"

# Only the bands that are not already readable need a label, and only one is: the deaths
# export carries an `unknown` band for records whose age was never established. It is kept
# rather than dropped, because dropping it would make the age breakdown sum to less than
# the death count it is a breakdown of and the gap would be invisible. Its share is
# negligible — 0,00% in 2025, at most 1,45% (İstanbul 2009) — but negligible is a finding,
# not a licence to hide it. The population has no such band.
[dim.age.values]
unknown = "Bilinmeyen"

[dim.household_type]
