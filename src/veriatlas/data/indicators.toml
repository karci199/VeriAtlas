# region Ratios — one set of breakdown values over another
#
# A comparison puts two *values* against each other. A ratio puts two *sets* of them, and
# that is what the dependency ratios need: (0-14 + 65+) ÷ 15-64 is three groups, not two,
# so it does not fit a comparison however it is bent.
#
# TÜİK publishes all three of these as measures of their own. They are computed here
# instead, from the age bands already loaded, for the reason K12 gives: a number that is
# an exact function of data we hold is a derivation, not a second download that can drift
# out of step with the first. The published ones are fetched anyway, once, as a check.
#
# Named through a grouping rather than through raw bands: the province file closes at 75+
# and the district export runs to 90+, so "65+" is a different list of bands at each
# level. The grouping already knows that, and it is only offered where it covers every
# band — so a ratio built on it cannot quietly drop anyone.

[ratio.child_dependency]
label_tr = "Çocuk bağımlılık oranı (%)"
label_en = "Child dependency ratio (%)"
dim = "age"
grouping = "age_broad"
over = ["0-14"]
under = ["15-64"]
unit = "percent"
note_tr = """
Çalışma çağındaki (15-64) her yüz kişiye düşen çocuk sayısı. Yüksek değer genç bir \
nüfus demektir — okul, kreş ve doğurganlık ile birlikte okunur."""

[ratio.old_age_dependency]
label_tr = "Yaşlı bağımlılık oranı (%)"
label_en = "Old-age dependency ratio (%)"
dim = "age"
grouping = "age_broad"
over = ["65+"]
under = ["15-64"]
unit = "percent"
note_tr = """
Çalışma çağındaki her yüz kişiye düşen 65 yaş üstü sayısı. Türkiye'de hızla yükseliyor; \
emeklilik ve sağlık harcamalarının en doğrudan göstergesi."""

[ratio.total_dependency]
label_tr = "Toplam yaş bağımlılık oranı (%)"
label_en = "Total age dependency ratio (%)"
dim = "age"
grouping = "age_broad"
over = ["0-14", "65+"]
under = ["15-64"]
unit = "percent"
note_tr = """
Çalışma çağı dışındaki her iki uç birlikte, çalışma çağındaki yüz kişiye oranla. \
Çocuk ve yaşlı oranı ters yönde hareket ettiği için toplam, ikisinin anlattığını \
gizleyebilir: aynı 50 değeri çok çocuklu bir ili de çok yaşlı bir ili de anlatır."""

# endregion

# region Derivations — series computed from a measurement, never stored
#
# A derived number is not a measurement and must not look like one, so each one declares
# what it produces (`unit`) and how honest it is (`quality`). The screen computes them on
# the fly: writing them to the fact table would lose which vintage they came from, and
# recomputing is cheap.
#
# `needs_span` marks a derivation that has no meaning at a single point in time — a
# yearly change needs two years — so views standing on one year hide it.

[derivation.index]
label_tr = "Endeks (ilk yıl = 100)"
label_en = "Index (first year = 100)"
unit = "index"
quality = "measured"
needs_span = true
note_tr = """
Her seri kendi ilk yılına bölünüp 100 ile çarpılır. Büyüklüğü değil hareketi gösterir: \
İstanbul ile Bartın aynı eksende karşılaştırılabilir hale gelir."""

[derivation.yoy]
label_tr = "Yıllık değişim (%)"
label_en = "Year-on-year change (%)"
unit = "percent"
quality = "measured"
needs_span = true
note_tr = """
Bir önceki yıla göre yüzde değişim. İlk yıl boş kalır — öncesi yoktur, sıfır değildir."""

[derivation.diff]
label_tr = "Yıllık fark"
label_en = "Year-on-year difference"
# The difference between two measurements is in the measurement's own unit, whatever that
# is, so this one has no unit of its own — the page keeps the indicator's.
unit = ""
quality = "measured"
needs_span = true
note_tr = """
Bir önceki yılla arasındaki fark, göstergenin kendi biriminde. Yüzde değişimden farkı, \
küçük bir tabandaki büyük yüzdeyi büyütmemesidir: 100 kişilik bir yerin %10'u 10 kişidir."""

[derivation.total_change]
label_tr = "İlk yıla göre değişim (%)"
label_en = "Change since first year (%)"
unit = "percent"
quality = "measured"
needs_span = true
note_tr = """
Serinin ilk yılından bugüne toplam yüzde değişim. Endeksin aynı bilgiyi taşıyan ama \
doğrudan okunan hâli: endekste 48,6 olan yer burada −51,4 çıkar. "Göreli düşüş en çok \
nerede" sorusunun cevabı, tabloda bu sütuna göre sıralanınca gelir."""

[derivation.total_diff]
label_tr = "İlk yıla göre fark"
label_en = "Difference since first year"
unit = ""
quality = "measured"
needs_span = true
note_tr = """
Serinin ilk yılından bugüne toplam fark, göstergenin kendi biriminde. Yüzdenin doğru \
cevap olmadığı yerde budur: ortanca yaş 34'ten 36'ya çıktıysa anlamlı olan "+2 yaş", \
"%5,9 arttı" değil."""

[derivation.cagr]
label_tr = "Ortalama yıllık büyüme (%)"
label_en = "Average annual growth (%)"
unit = "percent"
quality = "estimated"
needs_span = true
note_tr = """
Serinin ilk yılından o yıla kadar, yılda ortalama yüzde kaç büyüdüğü — bileşik olarak, \
yani her yılın büyümesi bir öncekinin üstüne binerek. "Yıllık değişim"den farkı: o tek \
bir yılı anlatır ve iyi/kötü bir yıl bütün resmi değiştirir; bu, bütün dönemi tek bir \
hıza indirger. Nüfusu 18 yılda 1,20 katına çıkan bir il yılda ortalama %1,0 büyümüştür, \
%20/18 = %1,1 değil."""

[derivation.ma3]
label_tr = "Hareketli ortalama (3 yıl)"
label_en = "Moving average (3 years)"
unit = ""
quality = "estimated"
needs_span = true
note_tr = """
Her yıl, kendisi ve komşu iki yılın ortalaması. Küçük alanların yıl yıl zıplayan \
serilerinde eğilimi görünür kılar. Ölçüm değil hesaplanmış bir değerdir — uçlardaki iki \
yıl, komşusu eksik olduğu için boş kalır."""

# endregion

# region Indicators

[indicator.tfr]
label_tr = "Toplam doğurganlık hızı"
label_en = "Total fertility rate"
topic = "dogurganlik"
unit = "children_per_woman"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Bir kadının doğurgan çağı boyunca, o yılın yaşa özel doğurganlık hızları geçerli \
kalsaydı doğuracağı ortalama çocuk sayısı. Yenilenme düzeyi 2,10 kabul edilir."""

# Kaba doğum ve kaba ölüm hızı burada yok, çünkü ikisi de tuttuğumuz iki sayının bölümü:
# doğum ÷ nüfus, ölüm ÷ nüfus. K12'nin kuralı — elimizdeki veriden tam olarak çıkan bir
# sayı türetmedir, ikinci bir indirme değil; ayrı yüklenirse ilk veriyle adım kaybeder.
# Ekranda "Alan nüfusunun %'si" kipi onları zaten veriyor (binde yerine yüzde olarak;
# aynı bilgi, farklı ölçek). MEDAS'ın yayımladıkları raw/medas/basit/ altında duruyor,
# bağımlılık oranlarında olduğu gibi denetim için.

# Births and deaths are taken **by place of residence** of the mother / the deceased, not
# by the place the event occurred. MEDAS publishes both. A province with a large maternity
# hospital records the births of the provinces around it, and one with a large hospital
# records their deaths; residence is the reading that belongs next to a population count.
# It also runs seventeen years against the other's eight.
[indicator.births]
label_tr = "Doğum sayısı"
label_en = "Live births"
topic = "dogurganlik"
unit = "birth"
frequency = "annual"
additive = true
dims = ["mother_age"]
views = ["table", "map", "line", "bar"]
definition_tr = """
Yıl içindeki canlı doğum sayısı, annenin ikamet ettiği ile göre. Ülke ve il düzeyinde \
annenin yaş grubuna bölünmüştür; ilçe düzeyinde bu ayrım yayımlanmadığı için toplam \
olarak durur."""

[indicator.deaths]
label_tr = "Ölüm sayısı"
label_en = "Deaths"
topic = "olum"
unit = "death"
frequency = "annual"
additive = true
dims = ["sex", "age"]
views = ["table", "map", "line", "bar", "pyramid"]
definition_tr = """
Yıl içindeki ölüm sayısı, ölen kişinin ikamet ettiği ile göre, cinsiyet ve yaş kırılımıyla. Yaş kırılımı il ve Türkiye düzeyinde var, ilçede yok."""

[indicator.migration_between_regions]
label_tr = "Bölgeler arası göç"
label_en = "Migration between regions"
topic = "nufus"
unit = "person"
frequency = "annual"
additive = true
dims = ["destination"]
views = ["table", "line", "bar"]
# The flow matrix the other migration indicators are margins of: aldığı is a column
# total, verdiği a row total, net their difference, and none of them says where anyone
# went. Stored at İBBS-2 because that is as fine as the published flow gets — the
# province measure that sounds like a matrix carries the reason for moving, not the
# destination.
definition_tr = """
Bir yıl içinde bir İBBS-2 bölgesinden diğerine taşınan kişi sayısı. Alan, göçü veren bölgedir; kırılım, göçün gittiği bölge. Köşegen sıfırdır: bölge içi taşınma bölgeler arası göç değildir. İl düzeyinde bu matris yayımlanmıyor."""

[indicator.household_by_size]
label_tr = "Hanehalkı sayısı (büyüklüğe göre)"
label_en = "Households by size"
topic = "nufus"
unit = "household"
frequency = "annual"
additive = true
dims = ["household_size_band"]
views = ["table", "map", "line", "bar"]
# The distribution behind , which is only its mean. Two provinces can
# share an average of 3,2 and look nothing alike — one mostly two-person households, the
# other split between people living alone and crowded houses. The mean cannot tell them
# apart and this can.
definition_tr = """
Hanehalkı sayısı, hanede yaşayan kişi sayısına göre. On bant: birden dokuza tek tek, onuncu bant "10 ve üzeri" olarak kapalı. Toplamı ilin hanehalkı sayısını verir."""

[indicator.household_by_tenure]
label_tr = "Hanehalkı sayısı (mülkiyet durumuna göre)"
label_en = "Households by tenure"
topic = "nufus"
unit = "household"
frequency = "annual"
additive = true
dims = ["tenure"]
views = ["table", "map", "bar"]
definition_tr = """
Hanehalkı sayısı, oturulan konutun mülkiyet durumuna göre: ev sahibi, kiracı, diğer. Tek yıl (2025) yayımlanıyor."""

[indicator.deaths_by_cause]
label_tr = "Ölüm sayısı (nedene göre)"
label_en = "Deaths by cause"
topic = "olum"
unit = "death"
frequency = "annual"
additive = true
dims = ["cause"]
views = ["table", "map", "line", "bar"]
# A separate indicator from , though it counts the same deaths: the cause series
# starts in 2022 where  runs from 2009, and it carries no age or sex. Merged, the
# indicator would gain a breakdown for four years and lose it for the other thirteen.
definition_tr = """
Yıl içindeki ölüm sayısı, ölüm nedenine göre, ölenin ikamet ettiği ile göre. Dokuz neden grubu bütünü kapsar: toplamları o yılın ölüm sayısını verir. TÜİK bu seriyi 2022'den itibaren yayımlıyor — öncesi farklı bir sınıflamada ve karşılaştırılabilir değil."""

[indicator.births_by_order]
label_tr = "Doğum sayısı (doğum sırasıyla)"
label_en = "Births by birth order"
topic = "dogurganlik"
unit = "birth"
frequency = "annual"
additive = true
dims = ["mother_age", "birth_order"]
views = ["table", "line", "bar"]
# The only fertility fact here that cannot be derived: every rate on this side is births
# over some group of women, but whether a birth was a woman's first or her fourth is not
# in any count of births. TÜİK publishes it for Türkiye only and MEDAS not at all, so it
# stays a separate indicator rather than a breakdown of `births` — which is by province
# and would then change shape with the area picked.
#
# The age groups are the source's, and finer at the young end than the MEDAS series:
# 15-17 and 18-19 where `births` has 15-19. Kept as published; merging stays possible,
# splitting does not.
definition_tr = """
Yıl içindeki canlı doğum sayısı, annenin yaş grubu ve çocuğun kaçıncı doğum olduğuyla. \
Yalnızca Türkiye düzeyinde yayımlanıyor. "Doğum sayısı" göstergesiyle aynı doğumları \
sayar; farkı, doğumun sırasını bilmesidir — bu bilgi başka hiçbir seriden \
hesaplanamaz."""

[indicator.deaths_single_age]
label_tr = "Ölüm sayısı (tek yaş)"
label_en = "Deaths by single year of age"
topic = "olum"
unit = "death"
frequency = "annual"
additive = true
dims = ["sex", "age"]
views = ["table", "line", "bar", "pyramid"]
# Kept as its own indicator rather than folded into `deaths`, though it counts the same
# deaths. MEDAS publishes the single year of age for the country only — tick that
# breakdown and the province option leaves the level box — so merging the two would give
# one indicator two resolutions depending on which area you picked: single years at the
# country, five-year bands at the province. Population lives with exactly that (single
# years at the province, bands at the district) because there the finer grain is the
# lower level; here it is the *higher* one, which reads as the series getting coarser as
# you zoom in. Two indicators say what is true: this one is the country's age curve, and
# `deaths` is the series that goes all the way down to the district.
#
# The two are not added anywhere: they are separate rows in the tree, and their totals
# agree to the death in every year checked.
definition_tr = """
Yıl içindeki ölüm sayısı, ölen kişinin tek yaşı ve cinsiyetiyle. Yalnızca Türkiye \
düzeyinde yayımlanıyor: kaynak bu kırılımı il için vermiyor. Aynı ölümleri sayar — \
"Ölüm sayısı" göstergesinin daha ince yaş çözünürlüğüdür, ona ek değildir."""

# Evlenme ve boşanma sayısı, kırılımları kapalı. MEDAS ikisinin altında da on kadar
# kırılım veriyor — eşlerin yaş grubu, eğitim durumu, evliliğin süresi, çocukların
# velayeti — ve hepsi açıkken ölçü 121 göstergeye çıkıp indirme iki yılda bir sorguya
# iniyor. Kapalıyken tek gösterge ve yirmi beş yıl tek seferde geliyor. Kırılımlar ayrı
# bir oturumun işi; ham dosyalar da o gün için duruyor.
[indicator.marriages]
label_tr = "Evlenme sayısı"
label_en = "Marriages"
topic = "evlenme_bosanma"
unit = "marriage"
frequency = "annual"
additive = true
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Yıl içinde kıyılan resmî nikâh sayısı, nikâhın kıyıldığı ile göre."""

[indicator.marriages_by_age]
label_tr = "Evlenme sayısı (kadın ve erkeğin yaş grubuyla)"
label_en = "Marriages by bride's and groom's age group"
topic = "evlenme_bosanma"
unit = "marriage"
frequency = "annual"
additive = true
dims = ["bride_age", "groom_age"]
views = ["table", "bar"]
definition_tr = """
Yıl içinde kıyılan nikâhlar, kadının ve erkeğin yaş grubuna göre çapraz: hangi yaştaki \
kadın hangi yaştaki erkekle evlenmiş. Hücrelerin toplamı evlenme sayısına eşittir."""

[indicator.marriages_district]
label_tr = "Evlenme sayısı (ilçe)"
label_en = "Marriages (district)"
topic = "evlenme_bosanma"
unit = "marriage"
frequency = "annual"
additive = true
dims = []
views = ["table", "map", "line", "bar"]
# Kept apart from `marriages` rather than loaded into it as a lower level, because it is
# not the same measurement one step down: MEDAS publishes the district series by the place
# the wedding happened and the provincial one by where the couple lives. A district with a
# popular wedding venue collects marriages belonging to the districts around it, so the
# district rows do not sum to the province's — and putting them in one indicator would
# make "Tümü (topla)" answer with a number neither series claims.
definition_tr = """
Yıl içinde kıyılan resmî nikâh sayısı, nikâhın kıyıldığı ilçeye göre. İl serisinden farkı \
budur: il sayıları çiftin ikamet ettiği yere göredir, bu seri olayın gerçekleştiği yere \
göre. İkisi aynı toplama gitmez."""

[indicator.divorces_district]
label_tr = "Boşanma sayısı (ilçe)"
label_en = "Divorces (district)"
topic = "evlenme_bosanma"
unit = "divorce"
frequency = "annual"
additive = true
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Yıl içinde kesinleşen boşanma sayısı, erkeğin ikametgahının bulunduğu ilçeye göre. \
MEDAS ilçe düzeyinde yalnız bu okumayı yayımlıyor; il serisi çiftin ikametine göredir, \
bu yüzden ikisi ayrı göstergedir."""

[indicator.divorces]
label_tr = "Boşanma sayısı"
label_en = "Divorces"
topic = "evlenme_bosanma"
unit = "divorce"
frequency = "annual"
additive = true
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Yıl içinde kesinleşen boşanma kararı sayısı. Evlenme sayısıyla aynı yılın oranı \
değildir: bu yıl boşananlar başka yıllarda evlenmiş çiftlerdir."""

[indicator.mean_first_marriage_age]
label_tr = "Ortalama ilk evlenme yaşı"
label_en = "Mean age at first marriage"
topic = "evlenme_bosanma"
unit = "year_of_age"
frequency = "annual"
dims = ["sex"]
views = ["table", "map", "line", "bar"]
definition_tr = """
Hayatında ilk kez evlenenlerin ortalama yaşı, cinsiyete göre. Toplam yok: bir evlilik \
erkeğin ilki, kadının ikincisi olabilir."""

[indicator.mean_marriage_age]
label_tr = "Ortalama evlenme yaşı"
label_en = "Mean age at marriage"
topic = "evlenme_bosanma"
unit = "year_of_age"
frequency = "annual"
dims = ["sex"]
views = ["table", "map", "line", "bar"]
definition_tr = """
O yıl evlenen herkesin ortalama yaşı, cinsiyete göre — ikinci ve sonraki evlilikler \
dahil. Bu yüzden ilk evlenme yaşından yüksektir."""

[indicator.natural_increase]
label_tr = "Doğal nüfus artışı"
label_en = "Natural increase"
topic = "nufus"
unit = "person"
frequency = "annual"
additive = true
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Doğum sayısı eksi ölüm sayısı: bir yerin göç olmadan, kendi kendine kazandığı ya da \
kaybettiği nüfus. Eksi değer ölümün doğumu geçtiği yer demektir."""

[indicator.infant_mortality]
label_tr = "Bebek ölüm hızı"
label_en = "Infant mortality rate"
topic = "olum"
unit = "per_thousand_live_births"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Bin canlı doğum başına, bir yaşını doldurmadan ölen bebek sayısı. Paydası nüfus değil, \
canlı doğumdur."""

[indicator.under5_mortality]
label_tr = "Beş yaş altı ölüm hızı"
label_en = "Under-five mortality rate"
topic = "olum"
unit = "per_thousand_live_births"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Bin canlı doğum başına, beşinci yaş gününü görmeden ölen çocuk sayısı. Bebek ölüm \
hızını içerir, onun yanına eklenmez."""

# The series is short and has holes on purpose: TÜİK builds provincial life tables from
# pooled three-year windows and publishes them irregularly, so the source offers 2013,
# 2014, 2017, 2020 and 2023 and nothing between. Every year MEDAS offers is taken; the
# gaps are the source's, not a partial download. A derivation over this reads across
# uneven steps — "yıllık değişim" between 2014 and 2017 is three years of change wearing
# a one-year label — which is why the definition says the years out loud.
#
# No total. Two life expectancies cannot be averaged into one without the birth cohorts
# as weights, and those are not in this file; the same rule that keeps ortalama ilk
# evlenme yaşı from having one.
[indicator.life_expectancy]
label_tr = "Doğuşta beklenen yaşam süresi"
label_en = "Life expectancy at birth"
topic = "olum"
unit = "year_of_age"
frequency = "annual"
dims = ["sex"]
views = ["table", "map", "line", "bar"]
definition_tr = """
O yıl doğan bir bebeğin, dönemin yaşa özel ölüm hızları ömrü boyunca geçerli kalsaydı \
yaşayacağı ortalama yıl sayısı. İl düzeyinde yalnız 2013, 2014, 2017, 2020 ve 2023 için \
yayımlanıyor."""

[indicator.pop_age_structure]
label_tr = "Yaş yapısı"
label_en = "Age structure"
topic = "nufus"
unit = "percent"
frequency = "annual"
dims = ["age"]
views = ["table", "line", "bar"]
definition_tr = """
Nüfusun yaş gruplarına dağılımı."""

[indicator.population]
label_tr = "Nüfus"
label_en = "Population"
topic = "nufus"
unit = "person"
frequency = "annual"
dims = ["age", "sex"]
views = ["table", "map", "line", "bar", "pyramid"]
definition_tr = """
İkamet edilen yerin nüfusu, beşli yaş grubu ve cinsiyet kırılımıyla. En üst grup 75+ \
olarak kapalıdır."""

[indicator.median_age]
label_tr = "Ortanca yaş"
label_en = "Median age"
topic = "nufus"
unit = "year_of_age"
frequency = "annual"
dims = ["sex"]
views = ["table", "map", "line", "bar"]
definition_tr = """
Nüfusu tam ortadan ikiye bölen yaş: yarısı bundan genç, yarısı yaşlıdır. Ortalama \
yaştan farkı, uçlardaki birkaç çok yaşlıdan etkilenmemesidir."""

[indicator.marital_status]
label_tr = "Medeni durum"
label_en = "Marital status"
topic = "nufus"
unit = "person"
frequency = "annual"
additive = true
dims = ["marital", "sex", "age"]
views = ["table", "map", "line", "bar"]
definition_tr = """
15 yaşını doldurmuş nüfusun medeni durumu — hiç evlenmedi, evli, boşandı, eşi öldü — \
cinsiyet ve beşli yaş grubu kırılımıyla. Yaş 15'ten başladığı için toplamı ilin nüfusu \
değildir."""

[indicator.population_density]
label_tr = "Nüfus yoğunluğu"
label_en = "Population density"
topic = "nufus"
unit = "person_per_km2"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Kilometrekareye düşen kişi sayısı: kaç kişi değil, ne kadar sıkışık."""

[indicator.household_size]
label_tr = "Ortalama hanehalkı büyüklüğü"
label_en = "Average household size"
topic = "nufus"
unit = "person_per_household"
frequency = "annual"
dims = []
