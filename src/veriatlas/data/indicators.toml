# Indicator dictionary — what every id in the fact table means.
#
# This file is a record of decisions, not data. TUIK does not tell us that "bina" and
# "daire" are different things; we do. So it lives in git, next to the code, with the
# reasoning attached.
#
# Rules:
#   - every indicator names a topic and a unit declared below
#   - `dims` lists the breakdown keys an indicator may carry; anything else fails at
#     load time, which is what keeps the flexible dims field from becoming a free-for-all
#   - `views` lists the ways the screen may draw it. The explorer offers exactly these
#     tabs and greys out the rest, so "which chart fits this number" is a recorded
#     decision here, not a branch buried in the page (decision K10)
#   - Turkish is a label, never an id (decision K1)

# region Topics — the left-hand tree, in display order

[topic.nufus]
label_tr = "Nüfus"
label_en = "Population"
order = 10

[topic.dogurganlik]
label_tr = "Doğurganlık"
label_en = "Fertility"
order = 20

[topic.yapi_ruhsati]
label_tr = "Yapı ruhsatı"
label_en = "Building permits"
order = 30

# endregion

# region Dimensions — the breakdown keys and what their stored values are called
#
# Values are ids in the fact table (`sex=female`), so the Turkish the reader sees lives
# here, next to everything else that is a label (K1). A dimension with no `values` table
# carries values that are already readable — age bands print as "25-29" in any language.

[dim.sex]
label_tr = "Cinsiyet"
label_en = "Sex"

[dim.sex.values]
female = "Kadın"
male = "Erkek"
# Not a third sex: the value that means "the two together". It exists because the median
# age has no published total and one had to be computed (see the indicator's note), and
# it is a stored value rather than the page's "Tümü (topla)" because a median cannot be
# summed into being.
total = "Toplam"

[dim.age]
label_tr = "Yaş grubu"
label_en = "Age group"

[dim.marital]
label_tr = "Medeni durum"
label_en = "Marital status"

[dim.marital.values]
never_married = "Hiç evlenmedi"
married = "Evli"
divorced = "Boşandı"
widowed = "Eşi öldü"
# Kept rather than folded into another status: these are people, and putting them
# somewhere would be inventing an answer TÜİK did not give. Disappears from the recent
# years — the column is simply absent, not zero.
unknown = "Bilinmeyen"

# endregion

# region Groupings — coarser readings of a breakdown, computed not stored
#
# A grouping says "these values of this dimension are read together, and the result is
# called this". It is the same idea as a derivation (K12) but across a breakdown instead
# of across time: nothing new is stored, the screen sums what the fact table already has.
#
# This is where "0-14 / 15-64 / 65+" lives rather than becoming its own indicator. Three
# reasons. Writing those sums into the fact table would store the same people twice and
# invite a query that counts them twice. Adding an indicator per grouping would multiply
# the tree by every way anyone might want to slice an age. And a grouping declared here
# is one line, checked at load time against the bands that actually exist — so adding a
# new way to read the data cannot break the old ones.
#
# `covers` lists the dimension values that add up into each group. They must be a
# partition: no value in two groups, or the total stops being the total.

[grouping.age_broad]
label_tr = "Geniş yaş grupları"
label_en = "Broad age groups"
dim = "age"
note_tr = """
Demografinin standart üçlüsü: çocuk, çalışma çağı, yaşlı. Bağımlılık oranları bu \
bölmeden hesaplanır."""

# The tail is listed in both encodings on purpose: the province file closes at 75+, the
# district export runs on to 90+, and they are the same people either way. A grouping is
# offered at a level only when every band *present there* falls into a group, so the list
# has to cover both or the coarse reading silently drops the oldest.
[grouping.age_broad.covers]
"0-14" = ["0-4", "5-9", "10-14"]
"15-64" = [
    "15-19", "20-24", "25-29", "30-34", "35-39",
    "40-44", "45-49", "50-54", "55-59", "60-64",
]
"65+" = ["65-69", "70-74", "75+", "75-79", "80-84", "85-89", "90+"]

[grouping.age_fertile]
label_tr = "Doğurgan çağ"
label_en = "Childbearing age"
dim = "age"
note_tr = """
15-49, TÜİK'in doğurganlık hesaplarında kullandığı aralık. Doğurganlık hızlarının \
paydası bu gruptaki kadın nüfusudur."""

[grouping.age_fertile.covers]
"0-14" = ["0-4", "5-9", "10-14"]
"15-49" = ["15-19", "20-24", "25-29", "30-34", "35-39", "40-44", "45-49"]
"50+" = [
    "50-54", "55-59", "60-64", "65-69", "70-74",
    "75+", "75-79", "80-84", "85-89", "90+",
]

# endregion

# region Comparisons — one breakdown value against another
#
# A grouping reads a breakdown coarsely; a comparison reads two of its values against
# each other. "İllere göre erkek-kadın farkı" is that, and it is neither an indicator nor
# a time derivation, so it gets its own line here rather than a branch in the page.
#
# Nothing is stored. The screen takes the slice at `plus`, the slice at `minus`, and
# combines them by `how`.

[comparison.sex_gap]
label_tr = "Erkek − Kadın (fark)"
label_en = "Male − female (difference)"
dim = "sex"
plus = "male"
minus = "female"
how = "difference"
unit = ""
note_tr = """
İki cinsiyetin farkı, göstergenin kendi biriminde. Nüfusta kaç kişi, ortanca yaşta kaç \
yıl. Eksi değer kadınların önde olduğu yer demektir."""

[comparison.sex_ratio]
label_tr = "Cinsiyet oranı (E/K × 100)"
label_en = "Sex ratio (M/F × 100)"
dim = "sex"
plus = "male"
minus = "female"
how = "ratio"
unit = "index"
note_tr = """
Yüz kadın başına düşen erkek. Doğumda ~105 beklenir; yaş ilerledikçe erkek ölümlülüğü \
yüksek olduğu için düşer. Yüzün çok üstündeki il değerleri genelde göç işaretidir."""

# endregion

# region Units

[unit.children_per_woman]
label_tr = "çocuk/kadın"
label_en = "children per woman"
decimals = 2
additive = false

[unit.person]
label_tr = "kişi"
label_en = "persons"
decimals = 0
additive = true

[unit.percent]
label_tr = "%"
label_en = "%"
# Two, not one. TÜİK publishes the dependency ratios to two decimals (41,97 · 8,48) and
# rounding them to 41,9 throws away a digit the source actually has. It matters more the
# smaller the number: annual population change runs between −2,7 and 2,0, where one
# decimal makes a fifth of the provinces look identical to their neighbours.
decimals = 2
additive = false

[unit.per_mille]
label_tr = "‰"
label_en = "‰"
decimals = 2
additive = false

[unit.year_of_age]
label_tr = "yaş"
label_en = "years of age"
decimals = 1
# An age is a position on a scale, not a quantity: adding two provinces' median ages
# gives nothing, and averaging them unweighted is the classic way to get it wrong.
additive = false

[unit.index]
label_tr = "endeks"
label_en = "index"
decimals = 1
additive = false

[unit.building]
label_tr = "bina"
label_en = "buildings"
decimals = 0
additive = true

[unit.dwelling]
label_tr = "daire"
label_en = "dwellings"
decimals = 0
additive = true

# endregion

# region Ratios — one set of breakdown values over another
#
# A comparison puts two *values* against each other. A ratio puts two *sets* of them, and
# that is what the dependency ratios need: (0-14 + 65+) ÷ 15-64 is three groups, not two,
# so it does not fit a comparison however it is bent.
#
# TÜİK publishes all three of these as measures of their own. They are computed here
# instead, from the age bands already loaded, for the reason K12 gives: a number that is
# an exact function of data we hold is a derivation, not a second download that can drift
# out of step with the first. The published ones are fetched anyway, once, as a check.
#
# Named through a grouping rather than through raw bands: the province file closes at 75+
# and the district export runs to 90+, so "65+" is a different list of bands at each
# level. The grouping already knows that, and it is only offered where it covers every
# band — so a ratio built on it cannot quietly drop anyone.

[ratio.child_dependency]
label_tr = "Çocuk bağımlılık oranı (%)"
label_en = "Child dependency ratio (%)"
dim = "age"
grouping = "age_broad"
over = ["0-14"]
under = ["15-64"]
unit = "percent"
note_tr = """
Çalışma çağındaki (15-64) her yüz kişiye düşen çocuk sayısı. Yüksek değer genç bir \
nüfus demektir — okul, kreş ve doğurganlık ile birlikte okunur."""

[ratio.old_age_dependency]
label_tr = "Yaşlı bağımlılık oranı (%)"
label_en = "Old-age dependency ratio (%)"
dim = "age"
grouping = "age_broad"
over = ["65+"]
under = ["15-64"]
unit = "percent"
note_tr = """
Çalışma çağındaki her yüz kişiye düşen 65 yaş üstü sayısı. Türkiye'de hızla yükseliyor; \
emeklilik ve sağlık harcamalarının en doğrudan göstergesi."""

[ratio.total_dependency]
label_tr = "Toplam yaş bağımlılık oranı (%)"
label_en = "Total age dependency ratio (%)"
dim = "age"
grouping = "age_broad"
over = ["0-14", "65+"]
under = ["15-64"]
unit = "percent"
note_tr = """
Çalışma çağı dışındaki her iki uç birlikte, çalışma çağındaki yüz kişiye oranla. \
Çocuk ve yaşlı oranı ters yönde hareket ettiği için toplam, ikisinin anlattığını \
gizleyebilir: aynı 50 değeri çok çocuklu bir ili de çok yaşlı bir ili de anlatır."""

# endregion

# region Derivations — series computed from a measurement, never stored
#
# A derived number is not a measurement and must not look like one, so each one declares
# what it produces (`unit`) and how honest it is (`quality`). The screen computes them on
# the fly: writing them to the fact table would lose which vintage they came from, and
# recomputing is cheap.
#
# `needs_span` marks a derivation that has no meaning at a single point in time — a
# yearly change needs two years — so views standing on one year hide it.

[derivation.index]
label_tr = "Endeks (ilk yıl = 100)"
label_en = "Index (first year = 100)"
unit = "index"
quality = "measured"
needs_span = true
note_tr = """
Her seri kendi ilk yılına bölünüp 100 ile çarpılır. Büyüklüğü değil hareketi gösterir: \
İstanbul ile Bartın aynı eksende karşılaştırılabilir hale gelir."""

[derivation.yoy]
label_tr = "Yıllık değişim (%)"
label_en = "Year-on-year change (%)"
unit = "percent"
quality = "measured"
needs_span = true
note_tr = """
Bir önceki yıla göre yüzde değişim. İlk yıl boş kalır — öncesi yoktur, sıfır değildir."""

[derivation.diff]
label_tr = "Yıllık fark"
label_en = "Year-on-year difference"
# The difference between two measurements is in the measurement's own unit, whatever that
# is, so this one has no unit of its own — the page keeps the indicator's.
unit = ""
quality = "measured"
needs_span = true
note_tr = """
Bir önceki yılla arasındaki fark, göstergenin kendi biriminde. Yüzde değişimden farkı, \
küçük bir tabandaki büyük yüzdeyi büyütmemesidir: 100 kişilik bir yerin %10'u 10 kişidir."""

[derivation.total_change]
label_tr = "İlk yıla göre değişim (%)"
label_en = "Change since first year (%)"
unit = "percent"
quality = "measured"
needs_span = true
note_tr = """
Serinin ilk yılından bugüne toplam yüzde değişim. Endeksin aynı bilgiyi taşıyan ama \
doğrudan okunan hâli: endekste 48,6 olan yer burada −51,4 çıkar. "Göreli düşüş en çok \
nerede" sorusunun cevabı, tabloda bu sütuna göre sıralanınca gelir."""

[derivation.total_diff]
label_tr = "İlk yıla göre fark"
label_en = "Difference since first year"
unit = ""
quality = "measured"
needs_span = true
note_tr = """
Serinin ilk yılından bugüne toplam fark, göstergenin kendi biriminde. Yüzdenin doğru \
cevap olmadığı yerde budur: ortanca yaş 34'ten 36'ya çıktıysa anlamlı olan "+2 yaş", \
"%5,9 arttı" değil."""

[derivation.cagr]
label_tr = "Ortalama yıllık büyüme (%)"
label_en = "Average annual growth (%)"
unit = "percent"
quality = "estimated"
needs_span = true
note_tr = """
Serinin ilk yılından o yıla kadar, yılda ortalama yüzde kaç büyüdüğü — bileşik olarak, \
yani her yılın büyümesi bir öncekinin üstüne binerek. "Yıllık değişim"den farkı: o tek \
bir yılı anlatır ve iyi/kötü bir yıl bütün resmi değiştirir; bu, bütün dönemi tek bir \
hıza indirger. Nüfusu 18 yılda 1,20 katına çıkan bir il yılda ortalama %1,0 büyümüştür, \
%20/18 = %1,1 değil."""

[derivation.ma3]
label_tr = "Hareketli ortalama (3 yıl)"
label_en = "Moving average (3 years)"
unit = ""
quality = "estimated"
needs_span = true
note_tr = """
Her yıl, kendisi ve komşu iki yılın ortalaması. Küçük alanların yıl yıl zıplayan \
serilerinde eğilimi görünür kılar. Ölçüm değil hesaplanmış bir değerdir — uçlardaki iki \
yıl, komşusu eksik olduğu için boş kalır."""

# endregion

# region Indicators

[indicator.tfr]
label_tr = "Toplam doğurganlık hızı"
label_en = "Total fertility rate"
topic = "dogurganlik"
unit = "children_per_woman"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Bir kadının doğurgan çağı boyunca, o yılın yaşa özel doğurganlık hızları geçerli \
kalsaydı doğuracağı ortalama çocuk sayısı. Yenilenme düzeyi 2,10 kabul edilir. \
TÜİK yalnızca il düzeyinde yayımlıyor, ilçe kırılımı yok."""

[indicator.cbr]
label_tr = "Kaba doğum hızı"
label_en = "Crude birth rate"
topic = "dogurganlik"
unit = "per_mille"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Bin kişi başına düşen canlı doğum sayısı. Doğurganlıktan çok yaş yapısını yansıtır: \
genç nüfuslu bir ilde doğurganlık düşse bile kaba hız yüksek kalabilir."""

[indicator.pop_age_structure]
label_tr = "Yaş yapısı"
label_en = "Age structure"
topic = "nufus"
unit = "percent"
frequency = "annual"
dims = ["age"]
views = ["table", "line", "bar"]
definition_tr = """
Nüfusun yaş gruplarına dağılımı. 2013 öncesi kent/kır ayrımı da taşınabilir; o \
satırlar IPF ile üretildiği için kalite bayrağı `estimated` olur."""

[indicator.population]
label_tr = "Nüfus"
label_en = "Population"
topic = "nufus"
unit = "person"
frequency = "annual"
dims = ["age", "sex"]
views = ["table", "map", "line", "bar", "pyramid"]
definition_tr = """
İkamet edilen yerin nüfusu, beşli yaş grubu ve cinsiyet kırılımıyla. Nüfus piramidi \
bu göstergeden çizilir. En üst grup 75+ olarak kapalıdır; kaynak dosya tek yaş verirken \
75'ten sonrasını toplulaştırıyor."""

[indicator.median_age]
label_tr = "Ortanca yaş"
label_en = "Median age"
topic = "nufus"
unit = "year_of_age"
frequency = "annual"
dims = ["sex"]
views = ["table", "map", "line", "bar"]
definition_tr = """
Nüfusu tam ortadan ikiye bölen yaş: yarısı bundan genç, yarısı yaşlıdır. Ortalama \
yaştan farkı, uçlardaki birkaç çok yaşlıdan etkilenmemesidir. TÜİK yalnızca erkek ve \
kadını ayrı ayrı yayımlıyor; **Toplam** bizim hesabımızdır (rozet: türetilmiş) ve iki \
ortancanın ortalaması değil, tek yaş nüfus dağılımının tam ortasıdır. Yöntem \
yayımlanan erkek/kadın değerlerine karşı sınandı: 3.116 karşılaştırmada ortalama \
mutlak fark 0,05 yıl, yani TÜİK'in kendi yuvarlaması kadar. İl ve Türkiye düzeyinde \
var, ilçe kırılımı yok."""

[indicator.marital_status]
label_tr = "Medeni durum"
label_en = "Marital status"
topic = "nufus"
unit = "person"
frequency = "annual"
additive = true
dims = ["marital", "sex", "age"]
views = ["table", "map", "line", "bar"]
definition_tr = """
15 yaşını doldurmuş nüfusun medeni durumu — hiç evlenmedi, evli, boşandı, eşi öldü — \
cinsiyet ve beşli yaş grubu kırılımıyla. Üç kırılım aynı anda yayımlandığı için "40-44 \
yaş kadınlarda boşanmışların sayısı" doğrudan sorulabiliyor. \
**Yaş 15'ten başlar**: medeni durum daha küçükler için yayımlanmaz, yani 0-14 eksik \
değil yoktur — bu göstergenin toplamı ilin nüfusu değildir. Bilinmeyen kategorisi son \
yıllarda kayboluyor; o yıllarda sütun sıfır değil, hiç yok. Türkiye, İBBS ve il \
düzeyinde var, ilçe kırılımı çekilmedi."""

[indicator.registry_population]
label_tr = "Kütük nüfusu"
label_en = "Registered population"
topic = "nufus"
unit = "person"
frequency = "annual"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = """
Bir yere nüfusa kayıtlı kişi sayısı — orada yaşayan değil. İkisinin oranı göçün \
ölçüsüdür: Sivas-İmranlı'da kayıtlı 92.658 kişiye karşılık ilçede 7.412 kişi var."""

# Bina ve daire ayrı göstergeler, çünkü aynı şey değiller: 2025'te 146.553 bina
# 1,19 milyon daire demek. Ön çalışmada bu ikisi karışmıştı; sözlüğün varlık
# sebeplerinden biri tam olarak bu.
[indicator.building_permits_buildings]
label_tr = "Yapı ruhsatı — bina sayısı"
label_en = "Building permits — buildings"
topic = "yapi_ruhsati"
unit = "building"
frequency = "quarterly"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = "Ruhsat verilen bina sayısı. Bir bina birden çok daire içerir."

[indicator.building_permits_dwellings]
label_tr = "Yapı ruhsatı — daire sayısı"
label_en = "Building permits — dwellings"
topic = "yapi_ruhsati"
unit = "dwelling"
frequency = "quarterly"
dims = []
views = ["table", "map", "line", "bar"]
definition_tr = "Ruhsat verilen daire sayısı. Bina sayısıyla karıştırılmamalı."

# endregion
