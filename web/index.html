<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>VeriAtlas</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="titlebar">
    <span class="app">VeriAtlas</span>
    <span class="subject">Nüfus ve doğurganlık</span>
    <span class="spacer"></span>
    <input id="search" type="search" placeholder="Ara …">
    <button class="control" id="theme-toggle" type="button">Açık tema</button>
</div>

<div class="shell">
    <main class="main">
        <div class="panels">
            <section class="panel">
                <h2>TÜM GÖSTERGELER</h2>
                <div class="panel-body">
                    <ul class="tree" id="tree"></ul>
                </div>
            </section>

            <section class="panel">
                <h2>ALAN SEÇİNİZ</h2>
                <div class="panel-body">
                    <label class="field">Düzey
                        <select id="level">
                            <option value="province">İl (81)</option>
                            <option value="nuts2">İBBS-2 alt bölge (26)</option>
                            <option value="nuts1">İBBS-1 bölge (12)</option>
                            <option value="region">Coğrafi bölge (7)</option>
                        </select>
                    </label>
                    <input id="area-search" type="search" placeholder="il ara…">
                    <div id="area-list" class="option-list" role="listbox" aria-multiselectable="true"></div>
                </div>
            </section>

            <section class="panel">
                <h2>SEÇTİKLERİM <span id="basket-count"></span></h2>
                <div class="panel-body">
                    <div class="basket" id="basket"></div>
                    <button class="control small" id="clear-areas" type="button">tümünü temizle</button>
                </div>
            </section>

            <section class="panel">
                <h2>RAPOR SEÇENEKLERİ</h2>
                <div class="panel-body">
                    <label class="field stacked">Başlangıç yılı
                        <input id="from" type="number" min="2009" max="2025" value="2009">
                    </label>
                    <label class="field stacked">Bitiş yılı
                        <input id="to" type="number" min="2009" max="2025" value="2025">
                    </label>
                    <label class="field stacked">Ondalık
                        <select id="decimals">
                            <option value="">birimden (2)</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </label>
                    <label class="field stacked">Türetme
                        <select id="transform">
                            <option value="level">Düzey</option>
                            <option value="change">İlk yıla göre fark</option>
                            <option value="index">Endeks (ilk yıl = 100)</option>
                        </select>
                    </label>
                    <div class="outputs">
                        <button class="control" id="show-table" type="button" aria-pressed="true">Tablo Oluştur</button>
                        <button class="control" id="show-chart" type="button" aria-pressed="true">Grafik Oluştur</button>
                        <button class="control" type="button" disabled title="sınır geometrisi eklenince">Harita Oluştur</button>
                    </div>
                </div>
            </section>
        </div>

        <section class="card" id="chart-card">
            <h3 id="chart-title">Toplam doğurganlık hızı</h3>
            <p class="unit" id="chart-unit"></p>
            <div id="chart"></div>
        </section>

        <section class="card" id="table-card">
            <div class="badges" id="badges"></div>
            <table>
                <colgroup>
                    <col style="width:40%"><col style="width:20%"><col style="width:20%"><col style="width:20%">
                </colgroup>
                <thead>
                    <tr><th id="th-area">alan</th><th id="th-from"></th><th id="th-to"></th><th>değişim</th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>
    </main>
</div>

<script type="module">
import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm";

const REPLACEMENT_LEVEL = 2.10;

// One default per level, so switching level never lands on an empty chart.
const DEFAULTS = {
    province: ["Bursa", "İzmir", "Şırnak"],
    nuts2: ["Bursa", "İzmir", "Mardin"],
    nuts1: ["Doğu Marmara", "Ege", "Güneydoğu Anadolu"],
    region: ["Marmara", "İç Anadolu", "Güneydoğu Anadolu"],
};

const PALETTE_SIZE = 10;

const $ = (id) => document.getElementById(id);

// Precision comes from the unit — a fertility rate wants two decimals, a dwelling count
// none — but the report panel can override it, the way EVDS lets you pick.
const decimals = () =>
    $("decimals").value === "" ? indicator.decimals : Number($("decimals").value);

const fmt = (v) => v.toLocaleString("tr-TR", {
    minimumFractionDigits: decimals(), maximumFractionDigits: decimals(),
});

// Chart colours live in theme.css like everything else; read them back rather than
// repeating the values here (decision K5).
function token(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function parseCsv(text) {
    const [header, ...lines] = text.trim().split(/\r?\n/);
    const cols = header.split(",");
    return lines.map((line) => {
        const cells = line.split(",");
        const row = Object.fromEntries(cols.map((c, i) => [c, cells[i]]));
        row.year = Number(row.year);
        row.value = Number(row.value);
        return row;
    });
}

// Opened as file:// the fetches below fail on origin rules and the page goes blank with
// no clue why. Say what to do instead.
async function read(path) {
    try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(response.status + " " + response.statusText);
        return response;
    } catch (cause) {
        document.querySelector(".main").innerHTML =
            `<section class="card notice">
                <h3>Veri okunamadı</h3>
                <p>Sayfa dosyadan açıldığında tarayıcı yerel veriyi okumaya izin vermiyor.
                Bir sunucu üzerinden açman gerekiyor:</p>
                <pre>cd C:\\veri
uv run python -m http.server 8123</pre>
                <p>Sonra: <a href="http://127.0.0.1:8123/web/index.html">127.0.0.1:8123/web/index.html</a></p>
                <p class="provenance">Okunamayan yol: ${path} — ${cause.message}</p>
            </section>`;
        throw cause;
    }
}

const data = parseCsv(await (await read("../public/tfr.csv")).text());
const meta = await (await read("../public/meta.json")).json();
const level = () => $("level").value;
const namesAt = (lvl) =>
    [...new Set(data.filter((d) => d.level === lvl).map((d) => d.area))]
        .sort((a, b) => a.localeCompare(b, "tr"));

// Nothing about an indicator is spelled out in this page: name, unit and precision all
// come from the dictionary (decision K7).
const FREQUENCY_TR = {annual: "yıllık", quarterly: "çeyreklik", monthly: "aylık"};
const indicator = meta.tree.flatMap((t) => t.indicators).find((i) => i.id === "tfr");

$("chart-title").textContent = indicator.label;
$("chart-title").title = indicator.definition;
$("chart-unit").textContent = indicator.unit + " · " + FREQUENCY_TR[indicator.frequency];

// Unloaded indicators stay in the tree, disabled: the tree is the plan as much as the
// inventory, and a greyed entry says "not yet" where an absent one would say "never".
$("tree").replaceChildren(...meta.tree.flatMap((group) => {
    const open = group.indicators.some((item) => item.available);

    const heading = document.createElement("li");
    heading.className = "group";
    heading.textContent = group.topic;
    heading.tabIndex = 0;
    heading.setAttribute("aria-expanded", String(open));
    heading.addEventListener("click", () => {
        const expanded = heading.getAttribute("aria-expanded") !== "true";
        heading.setAttribute("aria-expanded", String(expanded));
        for (const item of heading.parentElement.querySelectorAll("li")) {
            if (item.dataset.topic === group.topic) item.hidden = !expanded;
        }
    });

    return [heading, ...group.indicators.map((item) => {
        const li = document.createElement("li");
        li.dataset.topic = group.topic;
        li.hidden = !open;
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.label;
        button.disabled = !item.available;
        button.title = item.definition;
        if (item.id === indicator.id) button.setAttribute("aria-current", "true");
        li.append(button);
        return li;
    })];
}));

// Search has to survive Turkish typing habits: someone looking for Şanlıurfa types
// "sanli". Fold both sides rather than demanding the exact letters.
const FOLD = {ş: "s", ı: "i", İ: "i", ğ: "g", ü: "u", ö: "o", ç: "c", â: "a", î: "i"};
const fold = (s) => [...s.toLocaleLowerCase("tr")].map((c) => FOLD[c] ?? c).join("");

// The picker only shows what the filter matches, so the selection cannot live in the
// list — a province filtered out of view is still selected. The basket is what makes
// that safe to rely on: it shows the whole selection whatever the filter is doing.
const selected = new Set(DEFAULTS.province);

function selection() {
    const picked = namesAt(level()).filter((name) => selected.has(name));
    return {
        areas: picked.length ? picked : DEFAULTS[level()],
        from: Number($("from").value),
        to: Number($("to").value),
    };
}

function colourOf(area) {
    // The basket chip and the line must agree, so both read the position in the
    // selection rather than the position in whatever list is on screen.
    const index = selection().areas.indexOf(area);
    return token("--series-" + ((index % PALETTE_SIZE) + 1));
}

const LEVEL_NOUN = {
    province: "il", nuts2: "alt bölge", nuts1: "bölge", region: "bölge",
};

function fillAreas() {
    const query = fold($("area-search").value.trim());
    const shown = namesAt(level()).filter((name) => fold(name).includes(query));
    $("area-search").placeholder = LEVEL_NOUN[level()] + " ara…";

    // A plain <select multiple> needs ctrl-click to add a second item, and one stray
    // click wipes the selection. Rows that simply toggle are safer and themeable.
    $("area-list").replaceChildren(...shown.map((name) => {
        const row = document.createElement("div");
        row.className = "option";
        row.role = "option";
        row.tabIndex = 0;
        row.textContent = name;
        row.ariaSelected = String(selected.has(name));
        row.addEventListener("click", () => toggle(name));
        row.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggle(name);
            }
        });
        return row;
    }));

    if (!shown.length) {
        const empty = document.createElement("p");
        empty.className = "provenance";
        empty.style.padding = "6px";
        empty.textContent = "eşleşen " + LEVEL_NOUN[level()] + " yok";
        $("area-list").append(empty);
    }
}

function fillBasket() {
    const {areas} = selection();
    const empty = selected.size === 0;

    const chips = areas.map((area) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.style.borderLeftColor = colourOf(area);

        chip.append(document.createTextNode(area));

        // With nothing selected the chart falls back to a default trio. Those chips are
        // a label, not a selection — a remove button on them would silently *add* the
        // province instead of dropping it.
        if (!empty) {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "×";
            remove.title = area + " kaldır";
            remove.ariaLabel = area + " kaldır";
            remove.addEventListener("click", () => toggle(area));
            chip.append(remove);
        }

        return chip;
    });

    const label = document.createElement("p");
    label.className = "provenance";
    label.textContent = empty ? "seçim yok — varsayılan üçlü gösteriliyor" : "";

    $("basket-count").textContent = empty ? "" : "(" + selected.size + ")";
    $("clear-areas").disabled = empty;
    $("basket").replaceChildren(...(empty ? [label] : []), ...chips);
}

function toggle(name) {
    if (selected.has(name)) selected.delete(name);
    else selected.add(name);
    fillAreas();
    fillBasket();
    render();
}

// EVDS lets you ask for a derived series rather than the level. The derivation happens
// here, not in the stored data: the fact table keeps what the source published.
const TRANSFORMS = {
    level: {label: null, apply: (value) => value},
    change: {label: "ilk yıla göre fark", apply: (value, base) => value - base},
    index: {label: "endeks · ilk yıl = 100", apply: (value, base) => (value / base) * 100},
};

function render() {
    const {areas, from, to} = selection();
    const mode = $("transform").value;
    const transform = TRANSFORMS[mode];
    const colours = areas.map(colourOf);

    const inRange = data
        .filter((d) => d.level === level() && areas.includes(d.area))
        .filter((d) => d.year >= from && d.year <= to)
        .sort((a, b) => a.year - b.year);

    const base = new Map();
    for (const row of inRange) if (!base.has(row.area)) base.set(row.area, row.value);
    const rows = inRange.map((row) => ({
        ...row, value: transform.apply(row.value, base.get(row.area)),
    }));

    $("chart-unit").textContent = transform.label
        ? transform.label
        : indicator.unit + " · " + FREQUENCY_TR[indicator.frequency];

    $("chart").replaceChildren(Plot.plot({
        height: 260,
        marginLeft: 44,
        marginRight: 76,
        style: {background: "transparent", color: token("--text-tertiary"), fontSize: "11px"},
        x: {label: null, tickFormat: "d", grid: false},
        y: {label: null, grid: true, nice: true},
        color: {domain: areas, range: colours},
        marks: [
            // The replacement line means nothing once the series is a difference or an
            // index, so it only appears on the level.
            ...(mode === "level" ? [
                Plot.ruleY([REPLACEMENT_LEVEL], {
                    stroke: token("--reference-line"), strokeDasharray: "4 4",
                }),
                Plot.text([`yenilenme ${fmt(REPLACEMENT_LEVEL)}`], {
                    frameAnchor: "right", dy: -8, dx: -80, fill: token("--reference-text"),
                    y: REPLACEMENT_LEVEL, fontSize: 10,
                }),
            ] : []),
            Plot.lineY(rows, {x: "year", y: "value", stroke: "area", strokeWidth: 2}),
            // One dot per published observation, so a reader can tell where the data
            // actually is rather than trusting the line between the points.
            Plot.dot(rows, {
                x: "year", y: "value", fill: "area", r: 2.6,
                stroke: token("--bg-card"), strokeWidth: 1,
                title: (d) => `${d.area} · ${d.year} · ${fmt(d.value)}`,
            }),
            Plot.text(rows, Plot.selectLast({
                x: "year", y: "value", z: "area", text: "area", fill: "area",
                textAnchor: "start", dx: 6, fontSize: 10,
            })),
        ],
    }));

    const qualities = [...new Set(rows.map((d) => d.quality_flag))];
    const labels = {measured: "ölçüm", estimated: "tahmin", interpolated: "ara değer"};
    $("badges").replaceChildren(
        ...qualities.map((q) => {
            const span = document.createElement("span");
            span.className = "badge " + q;
            span.textContent = labels[q] ?? q;
            return span;
        }),
        Object.assign(document.createElement("span"), {
            className: "provenance",
            textContent: `${rows[0].source_id} · sürüm ${rows[0].vintage}`,
        }),
    );

    $("th-area").textContent = LEVEL_NOUN[level()];
    $("th-from").textContent = from;
    $("th-to").textContent = to;
    $("rows").replaceChildren(...areas.map((area, i) => {
        const series = rows.filter((d) => d.area === area).sort((a, b) => a.year - b.year);
        const first = series.at(0), last = series.at(-1);
        const delta = last.value - first.value;
        const tr = document.createElement("tr");
        tr.innerHTML =
            `<td><span class="swatch" style="background:${colours[i % colours.length]}"></span>${area}</td>` +
            `<td class="num">${fmt(first.value)}</td>` +
            `<td class="num">${fmt(last.value)}</td>` +
            `<td class="num ${delta < 0 ? "down" : "up"}">${delta < 0 ? "−" : "+"}${fmt(Math.abs(delta))}</td>`;
        return tr;
    }));
}

$("area-search").addEventListener("input", fillAreas);

// A province is not a region, so a selection cannot survive the switch. Clearing is the
// honest move; the defaults for the new level take over.
$("level").addEventListener("change", () => {
    selected.clear();
    $("area-search").value = "";
    fillAreas();
    fillBasket();
    render();
});

$("clear-areas").addEventListener("click", () => {
    selected.clear();
    fillAreas();
    fillBasket();
    render();
});

for (const id of ["from", "to", "decimals", "transform"]) {
    $(id).addEventListener("input", render);
}

// Output toggles, the way EVDS offers table / chart / map — except nothing is recomputed
// on the server, so these just show and hide what is already there.
for (const [id, card] of [["show-chart", "chart-card"], ["show-table", "table-card"]]) {
    $(id).addEventListener("click", () => {
        const on = $(id).getAttribute("aria-pressed") !== "true";
        $(id).setAttribute("aria-pressed", String(on));
        $(card).hidden = !on;
    });
}

// The indicator tree is still hardcoded; once the indicator dictionary exists this
// filters that list instead.
$("search").addEventListener("input", () => {
    const query = fold($("search").value.trim());
    let group = null;
    let items = [];

    // Matching a group keeps its children: a heading with nothing under it reads as a
    // bug, not as a filter.
    const flush = () => {
        if (!group) return;
        const groupHit = fold(group.textContent).includes(query);
        const hits = items.filter((item) => groupHit || fold(item.textContent).includes(query));

        // Searching overrides the accordion: a match must be visible even inside a
        // collapsed topic. With an empty box the collapsed state takes over again.
        const expanded = query ? hits.length > 0 : group.getAttribute("aria-expanded") === "true";
        if (query) group.setAttribute("aria-expanded", String(expanded));

        for (const item of items) item.hidden = !expanded || !hits.includes(item);
        group.hidden = query ? hits.length === 0 : false;
    };

    for (const item of document.querySelectorAll(".tree li")) {
        if (item.classList.contains("group")) {
            flush();
            group = item;
            items = [];
        } else {
            items.push(item);
        }
    }
    flush();
});

$("theme-toggle").addEventListener("click", () => {
    const light = document.documentElement.dataset.theme === "light";
    document.documentElement.dataset.theme = light ? "dark" : "light";
    $("theme-toggle").textContent = light ? "Açık tema" : "Koyu tema";
    fillBasket();
    render();
});

fillAreas();
fillBasket();
render();
</script>

</body>
</html>
