<!DOCTYPE html>
<!-- Population ranking across every level (province, district, belde, neighbourhood and
     village). Data: public/nufus_birimler.json, built by scripts/build_population_table.py. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nüfus sıralaması</title>
<meta name="color-scheme" content="dark light">
<style>
:root { --bg:#fbfaf7; --fg:#1d1d1b; --mut:#6b6a66; --line:#e3e1db; --acc:#2f5d8a; --pos:#2e7d32; --neg:#b3261e; --row:#f3f1ec; }
@media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#ecebe7; --mut:#9a9893; --line:#2e2e2c; --acc:#7fb0e0; --pos:#7cc47f; --neg:#ef8a80; --row:#1f1f1e; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding:16px; border-bottom:1px solid var(--line); }
h1 { margin:0 0 4px; font-size:20px; }
header p { margin:0; color:var(--mut); }
.controls { display:flex; flex-wrap:wrap; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:end; }
label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
select, input { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; min-width:120px; }
.seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { font:inherit; border:0; background:transparent; color:var(--fg); padding:6px 10px; cursor:pointer; }
.seg button.on { background:var(--acc); color:#fff; }
.summary { display:flex; flex-wrap:wrap; gap:24px; padding:10px 16px; color:var(--mut); }
.summary b { color:var(--fg); font-size:16px; }
.wrap { overflow-x:auto; padding:0 16px 24px; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { text-align:left; font-weight:600; font-size:12px; color:var(--mut); cursor:pointer; position:sticky; top:0; background:var(--bg); user-select:none; }
th.num, td.num { text-align:right; }
th.sorted::after { content:" ▾"; } th.sorted.asc::after { content:" ▴"; }
tbody tr:nth-child(even) { background:var(--row); }
td.pos { color:var(--pos); } td.neg { color:var(--neg); }
.bar { display:inline-block; height:8px; background:var(--acc); opacity:.55; border-radius:2px; vertical-align:middle; margin-left:6px; }
.more { margin:12px 0; }
.more button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
.note { padding:0 16px 16px; color:var(--mut); font-size:12px; max-width:900px; }
@media (max-width:600px) { .controls { gap:8px; } select, input { min-width:0; width:100%; } label { flex:1 1 45%; } }
</style>
</head>
<body>
<header>
  <h1>Nüfus sıralaması</h1>
  <p>İl, ilçe, belde, mahalle ve köy nüfusu; Türkiye, il ve ilçe içindeki payı; yıllara göre değişim. Kaynak: TÜİK ADNKS.</p>
</header>
<div class="controls">
  <label>Düzey <div class="seg" id="level"></div></label>
  <label>İl <select id="prov"></select></label>
  <label>İlçe <select id="dist"></select></label>
  <label>Yıl <select id="year"></select></label>
  <label>Karşılaştırma yılı <select id="base"></select></label>
  <label>Ara <input id="q" type="search" placeholder="ad yazın"></label>
</div>
<div class="summary" id="summary"></div>
<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
<div class="more" id="more"></div></div>
<div class="note" id="note"></div>
<script src="nufus.js"></script>
</body>
</html>
