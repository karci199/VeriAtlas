<!DOCTYPE html>
<!-- Population ranking across every level (province, district, belde, neighbourhood and
     village). Data: public/nufus_birimler.json, built by scripts/build_population_table.py. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nüfus sıralaması</title>
<meta name="color-scheme" content="dark light">
<style>
/* dark by design (user's choice); tokens kept on :root so a light variant is one block away */
:root { --bg:#111317; --panel:#181b21; --panel2:#1e222a; --fg:#e7e9ee; --mut:#8b92a0; --line:#262b34;
        --acc:#5b9bd5; --acc2:#2c4a6b; --pos:#6cc38a; --neg:#ef7d73; --hover:#222834; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:13.5px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding:18px 20px 10px; }
h1 { margin:0 0 4px; font-size:20px; font-weight:650; letter-spacing:-.01em; }
header p { margin:0; color:var(--mut); font-size:12.5px; }
.controls { display:flex; flex-wrap:wrap; gap:10px 14px; margin:10px 20px; padding:12px 14px; background:var(--panel);
            border:1px solid var(--line); border-radius:10px; align-items:end; }
label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
select, input { font:inherit; font-size:13px; text-transform:none; letter-spacing:0; color:var(--fg); background:var(--panel2);
                border:1px solid var(--line); border-radius:7px; padding:6px 9px; min-width:130px; outline:none; }
select:focus, input:focus { border-color:var(--acc); }
.seg { display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:2px; gap:2px; }
.seg button { font:inherit; font-size:13px; text-transform:none; letter-spacing:0; border:0; background:transparent; color:var(--mut);
              padding:5px 11px; border-radius:5px; cursor:pointer; }
.seg button:hover { color:var(--fg); }
.seg button.on { background:var(--acc); color:#0b1220; font-weight:600; }
.summary { display:flex; flex-wrap:wrap; gap:10px; margin:0 20px 10px; }
.summary span { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:8px 12px; color:var(--mut); font-size:12px; }
.summary b { display:block; color:var(--fg); font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; }
.wrap { margin:0 20px 20px; overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
table { border-collapse:separate; border-spacing:0; table-layout:fixed; width:max-content; font-variant-numeric:tabular-nums; }
th, td { padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
th { position:sticky; top:0; z-index:1; background:var(--panel2); text-align:left; font-weight:600; font-size:11.5px; color:var(--mut);
     cursor:pointer; user-select:none; }
th:hover { color:var(--fg); }
th.num, td.num { text-align:right; }
th.sorted { color:var(--acc); } th.sorted::after { content:" ▾"; } th.sorted.asc::after { content:" ▴"; }
th .grip { position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize; }
th .grip:hover, th .grip.drag { background:var(--acc2); }
tbody tr:hover { background:var(--hover); }
td.rank { color:var(--mut); }
td.name { font-weight:500; }
td.pos { color:var(--pos); } td.neg { color:var(--neg); }
.cell-bar { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.bar { flex:0 0 auto; height:6px; background:linear-gradient(90deg,var(--acc2),var(--acc)); border-radius:3px; }
.more { padding:10px; text-align:center; }
.more button, .tools button { font:inherit; font-size:12.5px; padding:6px 12px; border:1px solid var(--line); border-radius:7px;
                              background:var(--panel2); color:var(--fg); cursor:pointer; }
.more button:hover, .tools button:hover { border-color:var(--acc); }
input.numin { min-width:0; width:110px; }
label.check { flex-direction:row; align-items:center; gap:6px; padding-bottom:7px; text-transform:none; letter-spacing:0; font-size:12.5px; }
label.check input { min-width:0; accent-color:var(--acc); }
select:disabled { opacity:.45; }
td.new { color:var(--acc); font-style:italic; }
.colmenu { position:relative; }
.panel { position:absolute; z-index:5; top:34px; left:0; min-width:230px; background:var(--panel2); border:1px solid var(--line);
         border-radius:9px; padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.45); }
.panel label { flex-direction:row; align-items:center; gap:8px; padding:4px 6px; text-transform:none; letter-spacing:0; font-size:13px; color:var(--fg); border-radius:5px; cursor:pointer; }
.panel label:hover { background:var(--hover); }
.panel input { min-width:0; accent-color:var(--acc); }
.panel .dis { opacity:.4; cursor:default; }
th.key { color:var(--acc); }
a.link, a.info { color:var(--acc); text-decoration:none; cursor:pointer; }
a.info { margin-left:6px; font-size:12px; opacity:.8; }
a.info:hover, a.link:hover { opacity:1; text-decoration:underline; }
.pop { position:absolute; z-index:10; max-width:420px; background:var(--panel2); border:1px solid var(--line); border-radius:9px;
       padding:10px 12px; box-shadow:0 10px 30px rgba(0,0,0,.5); font-size:12.5px; color:var(--fg); white-space:normal; }
.pop h4 { margin:0 0 6px; font-size:13px; }
.pop ul { margin:0; padding-left:18px; } .pop li { margin:3px 0; color:var(--mut); }
.tools { margin:0 20px 8px; display:flex; gap:8px; color:var(--mut); font-size:12px; align-items:center; }
.note { margin:0 20px 24px; color:var(--mut); font-size:12px; max-width:900px; }
@media (max-width:600px) { .controls, .summary, .wrap, .tools, .note { margin-left:16px; margin-right:16px; }
  select, input { min-width:0; width:100%; } label { flex:1 1 45%; } }
</style>
</head>
<body>
<header>
  <h1>Nüfus sıralaması</h1>
  <p>İl, ilçe, belde, mahalle ve köy nüfusu. Kaynak: TÜİK ADNKS. <a href="#" id="notesLink" class="link">Notlar</a></p>
</header>
<div class="controls">
  <label>Düzey <div class="seg" id="level"></div></label>
  <label>Gösterge <select id="indicator"></select></label>
  <label>Görünüm <div class="seg" id="view"></div></label>
  <label>İl <select id="prov"></select></label>
  <label>İlçe <select id="dist"></select></label>
  <label>Yerleşim <select id="settle"></select></label>
  <label>Yıl <select id="year"></select></label>
  <label>Karşılaştırma yılı <select id="base"></select></label>
  <label>Nüfus en az <input id="minPop" type="number" min="0" step="100" placeholder="0" class="numin"></label>
  <label>en çok <input id="maxPop" type="number" min="0" step="1000" placeholder="sınırsız" class="numin"></label>
  <label>Ara <input id="q" type="search" placeholder="ad yazın"></label>
</div>
<div class="summary" id="summary"></div>
<div class="tools"><div class="colmenu"><button id="colBtn">Sütunlar ▾</button><div id="colPanel" class="panel" hidden></div></div>
  <span>Genişlik: başlığın sağ kenarından sürükleyin</span> <button id="resetCols">Sıfırla</button></div>
<div class="wrap"><table><colgroup id="cols"></colgroup><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
<div class="more" id="more"></div></div>
<div id="pop" class="pop" hidden></div>
<script src="nufus.js?v=8"></script>
</body>
</html>
