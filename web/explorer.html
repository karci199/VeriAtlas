<!DOCTYPE html>
<!-- The explorer shell (decision K10). Structure only: every label, control and tab
     below is filled in by explorer.js from the dictionary, so this file never names an
     indicator, a breakdown or a chart type. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriAtlas — veri gezgini</title>

<!-- What a bookmark, a shared link and a search result show. Without these the browser
     falls back to the URL, which is what the bookmark dialog was offering: a blank icon
     and "localhost". The favicon is inline SVG rather than a file so the page keeps
     working from any directory and needs no second request. -->
<!-- One line each: a meta tag's content keeps the newlines it is written with, and a
     bookmark or a search result would show them. -->
<meta name="description" content="Türkiye'nin nüfus ve demografi istatistikleri: il ve Türkiye düzeyinde nüfus, yaş yapısı, ortanca yaş, medeni durum, doğurganlık. Harita, çizgi, dağılım ve piramit olarak, kaynağı belirtilmiş TÜİK verisiyle.">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="VeriAtlas — veri gezgini">
<meta property="og:description" content="Türkiye'nin nüfus ve demografi istatistikleri, TÜİK kaynaklı, il düzeyinde.">
<meta property="og:type" content="website">

<!-- Six bars rising: the shape the page is mostly made of. Drawn on the accent colour so
     the tab icon and the charts are recognisably the same thing. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Cg fill='%237aa2f7'%3E%3Crect x='5' y='19' width='3.4' height='8' rx='1'/%3E%3Crect x='10' y='15' width='3.4' height='12' rx='1'/%3E%3Crect x='15' y='9' width='3.4' height='18' rx='1'/%3E%3Crect x='20' y='12' width='3.4' height='15' rx='1'/%3E%3Crect x='25' y='5' width='3.4' height='22' rx='1'/%3E%3C/g%3E%3C/svg%3E">

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="explorer.css">
</head>
<body>

<header class="page-head">
    <h1 id="page-title">Veri gezgini</h1>
    <span class="spacer"></span>

    <div class="settings">
        <button class="icon-button" id="settings-toggle" aria-expanded="false">⚙ Görünüm</button>

        <div class="settings-body" id="settings-body" hidden>
            <label class="setting">
                <span>Tema</span>
                <div class="choices" id="set-theme">
                    <button data-value="dark">Koyu</button>
                    <button data-value="light">Açık</button>
                </div>
            </label>

            <label class="setting">
                <span>Yazı tipi</span>
                <div class="choices" id="set-face"></div>
            </label>

            <label class="setting">
                <span>Yazı boyutu — <b id="set-font-value">%100</b></span>
                <input type="range" id="set-font" min="85" max="140" step="5">
            </label>

            <label class="setting">
                <span>Yoğunluk — <b id="set-density-value">%100</b></span>
                <input type="range" id="set-density" min="80" max="130" step="5">
            </label>

            <label class="setting">
                <span>Vurgu rengi</span>
                <div class="swatches" id="set-accent"></div>
            </label>

            <button class="link-button" id="set-reset">Varsayılana dön</button>
        </div>
    </div>
</header>

<div class="explorer">

    <!-- region Left rail: what is being compared -->
    <aside class="rail panel">
        <p class="rail-title" id="rail-title">Veri Gezgini</p>
        <p class="rail-note" id="rail-note"></p>

        <div class="search">
            <span aria-hidden="true">⌕</span>
            <!-- The browser's own form history offered "kaleci" and "kadıköy" over a
                 list of provinces; this box searches the data, not the reader's past. -->
            <input id="entity-search" placeholder="İl ya da bölge ekle"
                   autocomplete="off" spellcheck="false">
        </div>

        <div class="rail-row">
            <label for="level">Düzey</label>
            <select id="level"></select>
        </div>

        <!-- Only shown at a level whose areas sit inside a bigger one: 973 districts in
             one alphabetical run is a list nobody can find anything in. -->
        <div class="rail-row" id="group-row" hidden>
            <label for="group">İçinde</label>
            <select id="group"></select>
        </div>

        <div class="rail-head" id="chosen-head" hidden>Seçtiklerim</div>
        <ul class="chosen" id="chosen"></ul>

        <div class="rail-head">
            Tümü
            <span class="spacer"></span>
            <button class="chip" id="select-all">Tümünü seç</button>
            <button class="chip" id="select-none">Kaldır</button>
        </div>
        <ul class="entities" id="entities"></ul>
        <button class="link-button" id="clear-selection">✕ Seçimi temizle</button>
    </aside>
    <!-- endregion -->

    <!-- region Breakdown strip: dims the indicator declares -->
    <section class="dims panel" id="dims"></section>
    <!-- endregion -->

    <!-- region Chart card -->
    <section class="chart">
        <h2 id="chart-title"></h2>
        <p class="subtitle" id="chart-subtitle"></p>
        <p class="definition" id="chart-definition"></p>

        <div class="tabs" id="tabs"></div>
        <div id="view"></div>

        <div class="time" id="time">
            <button class="icon-button" id="play" title="Yılları oynat">▶</button>
            <span class="yr" id="year-from"></span>
            <input type="range" id="year">
            <span class="yr" id="year-to" style="text-align:right"></span>
        </div>

        <!-- Under the view, not above it: the explanation is of the thing that was just
             drawn, and the reader who has a question has it *after* looking. -->
        <section class="reading" id="reading"></section>

        <div class="foot">
            <div class="source" id="source"></div>
            <div class="actions">
                <button class="icon-button" id="download">⭳ İndir</button>
                <button class="icon-button" id="share">↗ Bağlantı</button>
            </div>
        </div>
    </section>
    <!-- endregion -->
</div>

<!-- The query is a cache buster, bumped by hand when a stale script would otherwise be
     served. `scripts/serve.py` sends no-store so this should never be needed again; it is
     here because a copy cached before that existed can outlive the fix, and an afternoon
     was spent on a bug that had already been fixed twice. -->
<script type="module" src="explorer.js?v=3"></script>
</body>
</html>
